<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MedSync — Sign in</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-wrap { max-width: 380px; width: 100%; padding: 0 20px; }
  .login-logo {
    width: 56px; height: 56px; margin: 0 auto 18px;
    border-radius: 18px;
    background: linear-gradient(135deg, var(--primary), var(--primary-2) 55%, var(--primary-3));
    box-shadow: 0 10px 30px -6px rgba(99, 102, 241, 0.55);
    display: flex; align-items: center; justify-content: center;
    animation: popIn .6s var(--ease) both, float 5s ease-in-out .6s infinite;
  }
  .login-logo svg { width: 28px; height: 28px; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  .login-title {
    text-align: center; font-size: 1.5rem; font-weight: 800; letter-spacing: -0.03em;
    margin: 0 0 4px;
    background: none; -webkit-background-clip: initial; background-clip: initial; color: var(--text);
    animation: fadeInUp .6s var(--ease) .1s both;
  }
  .login-wrap .sub { text-align: center; margin-bottom: 28px; animation-delay: .15s; }
  .login-wrap .card { animation-delay: .2s; }
  .login-wrap .card:hover { transform: none; }
  button[type="submit"] { width: 100%; margin-top: 22px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  #err { min-height: 1.2em; text-align: center; }
  .field-wrap { position: relative; }
</style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4.8 12.2a2.4 2.4 0 0 1 4.15-1.63l.2.2a1 1 0 0 0 1.5-.1l1.1-1.4a1 1 0 0 1 1.6.05l1.3 1.75a1 1 0 0 0 1.5.09l.15-.15a2.4 2.4 0 1 1 3.05 3.7l-6.5 5.2a1.6 1.6 0 0 1-2 0l-6.5-5.2a2.4 2.4 0 0 1-.55-2.51Z"/>
        <path d="M3 12h2.5l1.5-3 2 6 1.5-3H15"/>
      </svg>
    </div>
    <h1 class="login-title">Welcome back</h1>
    <p class="sub">Sign in to access the diagnostic dashboard.</p>

    <div class="card">
      <form id="login-form">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button type="submit" id="submit-btn">
          <span id="btn-label">Sign in</span>
        </button>
        <div id="err" class="err"></div>
      </form>
    </div>
  </div>

<script>
const form = document.getElementById('login-form');
const btn = document.getElementById('submit-btn');
const btnLabel = document.getElementById('btn-label');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('err');
  err.textContent = '';
  btn.disabled = true;
  btnLabel.innerHTML = '<span class="spinner"></span> Signing in…';

  const body = new URLSearchParams();
  body.append('username', document.getElementById('username').value);
  body.append('password', document.getElementById('password').value);

  try {
    const resp = await fetch('/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body,
    });
    if (!resp.ok) {
      const data = await resp.json().catch(() => ({}));
      throw new Error(data.detail || 'Login failed');
    }
    const data = await resp.json();
    localStorage.setItem('medsync_token', data.access_token);
    btnLabel.textContent = 'Success ✓';
    window.location.href = '/';
  } catch (e) {
    err.textContent = e.message;
    btn.disabled = false;
    btnLabel.textContent = 'Sign in';
  }
});
</script>
</body>
</html>
