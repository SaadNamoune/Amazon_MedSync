<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MedSync — Sign in</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  .login-wrap { max-width: 360px; margin: 100px auto; padding: 0 16px; }
  .login-wrap .brand { font-size: 1.4rem; margin-bottom: 4px; justify-content: center; display: flex; }
  .login-wrap .sub { text-align: center; margin-bottom: 24px; }
  button { width: 100%; margin-top: 22px; }
  #err { min-height: 1.2em; }
</style>
</head>
<body>
  <div class="login-wrap">
    <div class="brand">MedSync<span class="dot">.</span></div>
    <p class="sub">Sign in to access the diagnostic dashboard.</p>

    <div class="card">
      <form id="login-form">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button type="submit">Sign in</button>
        <div id="err" class="err"></div>
      </form>
    </div>
  </div>

<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('err');
  err.textContent = '';

  const body = new URLSearchParams();
  body.append('username', document.getElementById('username').value);
  body.append('password', document.getElementById('password').value);

  try {
    const resp = await fetch('/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body,
    });
    if (!resp.ok) {
      const data = await resp.json().catch(() => ({}));
      throw new Error(data.detail || 'Login failed');
    }
    const data = await resp.json();
    localStorage.setItem('medsync_token', data.access_token);
    window.location.href = '/';
  } catch (e) {
    err.textContent = e.message;
  }
});
</script>
</body>
</html>
