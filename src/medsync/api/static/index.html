<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MedSync Diagnostic Dashboard</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  #drop {
    border: 2px dashed var(--border);
    border-radius: 14px;
    padding: 40px 24px;
    text-align: center;
    cursor: pointer;
    transition: border-color .25s var(--ease), background .25s var(--ease), transform .25s var(--ease);
  }
  #drop:hover { border-color: var(--primary); transform: translateY(-1px); }
  #drop.drag { border-color: var(--primary); background: var(--primary-bg); transform: scale(1.01); }
  #drop-icon {
    width: 44px; height: 44px; margin: 0 auto 12px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 18px -4px rgba(99, 102, 241, 0.45);
  }
  #drop-icon svg { width: 22px; height: 22px; }
  #drop .hint { color: var(--text-muted); font-size: 0.9rem; margin-top: 4px; }
  #drop .title { font-weight: 700; font-size: 0.98rem; }

  .result-layout { display: grid; grid-template-columns: 200px 1fr; gap: 24px; align-items: start; }
  @media (max-width: 620px) { .result-layout { grid-template-columns: 1fr; } }
  #preview-wrap { display: none; }
  #preview { width: 100%; border-radius: 12px; box-shadow: var(--shadow-md); animation: popIn .4s var(--ease) both; }

  .finding-row {
    display: grid; grid-template-columns: 1fr auto; align-items: center;
    gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border);
    opacity: 0; animation: fadeInUp .45s var(--ease) forwards;
  }
  .finding-row:last-child { border-bottom: none; }
  .finding-name { font-weight: 600; font-size: 0.92rem; }
  .finding-pct { font-weight: 800; font-size: 0.92rem; min-width: 44px; text-align: right; }
  .finding-bar-bg { grid-column: 1 / -1; height: 7px; border-radius: 99px; background: var(--border); overflow: hidden; }
  .finding-bar-fill {
    height: 100%; border-radius: 99px; width: 0;
    background: linear-gradient(90deg, var(--primary), var(--primary-2));
    transition: width 1s var(--ease);
  }
  .finding-bar-fill.high { background: linear-gradient(90deg, #f59e0b, var(--danger)); }

  #loading-row { display: none; align-items: center; gap: 10px; color: var(--text-muted); font-size: 0.92rem; padding: 14px 0; }
  #loading-row .spinner { border-top-color: var(--primary); border-color: rgba(99, 102, 241, .25); }
  #result-area { margin-top: 22px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div class="topbar">
    <a class="brand" href="/">MedSync<span class="dot">.</span></a>
    <nav>
      <a href="/" class="active">Diagnostic Dashboard</a>
      <a href="/monitoring">Federation Monitor</a>
      <a href="#" id="logout-link">Sign out</a>
    </nav>
  </div>

  <div class="page">
    <h1>Diagnostic Dashboard</h1>
    <p class="sub">Upload a chest X-ray to query the current federated global model.</p>

    <div class="card">
      <div id="drop">
        <input type="file" id="file" accept="image/png,image/jpeg" class="hidden">
        <div id="drop-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 16V4M12 4l-4 4M12 4l4 4"/>
            <path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
          </svg>
        </div>
        <div class="title">Click or drop a chest X-ray here</div>
        <div class="hint">JPEG or PNG</div>
      </div>

      <div id="err" class="err"></div>

      <div id="loading-row"><span class="spinner"></span> Running inference…</div>

      <div id="result-area" class="hidden">
        <div class="result-layout">
          <div id="preview-wrap"><img id="preview"></div>
          <div>
            <div id="results-body"></div>
            <div id="meta" class="meta"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
const token = localStorage.getItem('medsync_token');
if (!token) {
  window.location.href = '/login';
}

document.getElementById('logout-link').addEventListener('click', (e) => {
  e.preventDefault();
  localStorage.removeItem('medsync_token');
  window.location.href = '/login';
});

const drop = document.getElementById('drop');
const fileInput = document.getElementById('file');
const preview = document.getElementById('preview');
const previewWrap = document.getElementById('preview-wrap');
const err = document.getElementById('err');
const loadingRow = document.getElementById('loading-row');
const resultArea = document.getElementById('result-area');
const resultsBody = document.getElementById('results-body');
const meta = document.getElementById('meta');

drop.addEventListener('click', () => fileInput.click());
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('drag'); });
drop.addEventListener('dragleave', () => drop.classList.remove('drag'));
drop.addEventListener('drop', e => {
  e.preventDefault();
  drop.classList.remove('drag');
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => {
  if (fileInput.files.length) handleFile(fileInput.files[0]);
});

async function handleFile(file) {
  err.textContent = '';
  resultArea.classList.add('hidden');
  meta.textContent = '';
  loadingRow.style.display = 'flex';

  previewWrap.style.display = 'block';
  preview.src = URL.createObjectURL(file);

  const formData = new FormData();
  formData.append('file', file);

  try {
    const resp = await fetch('/predict', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${token}` },
      body: formData,
    });
    if (resp.status === 401) {
      localStorage.removeItem('medsync_token');
      window.location.href = '/login';
      return;
    }
    if (!resp.ok) {
      const body = await resp.json().catch(() => ({}));
      throw new Error(body.detail || `Request failed (${resp.status})`);
    }
    const data = await resp.json();
    renderResults(data);
  } catch (e) {
    err.textContent = e.message;
  } finally {
    loadingRow.style.display = 'none';
  }
}

function renderResults(data) {
  resultsBody.innerHTML = '';
  let i = 0;
  for (const [label, prob] of Object.entries(data.findings)) {
    const pct = Math.round(prob * 100);
    const row = document.createElement('div');
    row.className = 'finding-row';
    row.style.animationDelay = `${i * 45}ms`;
    row.innerHTML = `
      <span class="finding-name">${label.replaceAll('_', ' ')}</span>
      <span class="finding-pct">${pct}%</span>
      <div class="finding-bar-bg"><div class="finding-bar-fill ${pct >= 50 ? 'high' : ''}"></div></div>
    `;
    resultsBody.appendChild(row);
    i++;
  }
  resultArea.classList.remove('hidden');
  meta.textContent = `Inference time: ${data.inference_ms} ms`;

  // Animate bar fills after layout, and stagger via requestAnimationFrame
  // so the width transition actually plays instead of jumping straight in.
  requestAnimationFrame(() => {
    resultsBody.querySelectorAll('.finding-bar-fill').forEach((el, idx) => {
      const pct = el.parentElement.previousElementSibling.textContent;
      setTimeout(() => { el.style.width = pct; }, idx * 45);
    });
  });
}
</script>
</body>
</html>
