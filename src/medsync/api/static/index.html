<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MedSync Diagnostic Dashboard</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  #drop { border: 2px dashed var(--border); border-radius: 10px; padding: 36px; text-align: center; cursor: pointer; transition: border-color .15s, background .15s; }
  #drop.drag { border-color: var(--primary); background: var(--primary-bg); }
  #drop span { color: var(--text-muted); font-size: 0.95rem; }
  #preview { max-width: 100%; margin-top: 16px; border-radius: 10px; display: none; }
  .bar { background: var(--primary); height: 8px; border-radius: 4px; }
  .barbg { background: var(--border); border-radius: 4px; width: 100%; }
  .hidden { display: none; }
</style>
</head>
<body>
  <div class="topbar">
    <a class="brand" href="/">MedSync<span class="dot">.</span></a>
    <nav>
      <a href="/" class="active">Diagnostic Dashboard</a>
      <a href="/monitoring">Federation Monitor</a>
      <a href="#" id="logout-link">Sign out</a>
    </nav>
  </div>

  <div class="page">
    <h1>Diagnostic Dashboard</h1>
    <p class="sub">Upload a chest X-ray to query the current federated global model.</p>

    <div class="card">
      <div id="drop">
        <input type="file" id="file" accept="image/png,image/jpeg" class="hidden">
        <span>Click or drop a JPEG/PNG chest X-ray here</span>
      </div>
      <img id="preview">
      <div id="err"></div>
      <table id="results" class="hidden">
        <thead><tr><th>Finding</th><th>Probability</th><th></th></tr></thead>
        <tbody id="results-body"></tbody>
      </table>
      <div id="meta"></div>
    </div>
  </div>

<script>
const token = localStorage.getItem('medsync_token');
if (!token) {
  window.location.href = '/login';
}

document.getElementById('logout-link').addEventListener('click', (e) => {
  e.preventDefault();
  localStorage.removeItem('medsync_token');
  window.location.href = '/login';
});

const drop = document.getElementById('drop');
const fileInput = document.getElementById('file');
const preview = document.getElementById('preview');
const err = document.getElementById('err');
const resultsTable = document.getElementById('results');
const resultsBody = document.getElementById('results-body');
const meta = document.getElementById('meta');

drop.addEventListener('click', () => fileInput.click());
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('drag'); });
drop.addEventListener('dragleave', () => drop.classList.remove('drag'));
drop.addEventListener('drop', e => {
  e.preventDefault();
  drop.classList.remove('drag');
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => {
  if (fileInput.files.length) handleFile(fileInput.files[0]);
});

async function handleFile(file) {
  err.textContent = '';
  resultsTable.classList.add('hidden');
  meta.textContent = '';

  preview.src = URL.createObjectURL(file);
  preview.style.display = 'block';

  const formData = new FormData();
  formData.append('file', file);

  try {
    const resp = await fetch('/predict', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${token}` },
      body: formData,
    });
    if (resp.status === 401) {
      localStorage.removeItem('medsync_token');
      window.location.href = '/login';
      return;
    }
    if (!resp.ok) {
      const body = await resp.json().catch(() => ({}));
      throw new Error(body.detail || `Request failed (${resp.status})`);
    }
    const data = await resp.json();
    renderResults(data);
  } catch (e) {
    err.textContent = e.message;
  }
}

function renderResults(data) {
  resultsBody.innerHTML = '';
  for (const [label, prob] of Object.entries(data.findings)) {
    const tr = document.createElement('tr');
    const pct = Math.round(prob * 100);
    tr.innerHTML = `
      <td>${label.replaceAll('_', ' ')}</td>
      <td>${pct}%</td>
      <td><div class="barbg"><div class="bar" style="width:${pct}%"></div></div></td>
    `;
    resultsBody.appendChild(tr);
  }
  resultsTable.classList.remove('hidden');
  meta.textContent = `Inference time: ${data.inference_ms} ms`;
}
</script>
</body>
</html>
